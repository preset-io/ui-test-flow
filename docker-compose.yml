version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: uitestflow-postgres
    environment:
      POSTGRES_USER: uitest
      POSTGRES_PASSWORD: uitest
      POSTGRES_DB: uitest
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uitest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uitestflow

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: uitestflow-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - uitestflow

  # FastAPI Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: uitestflow-app
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug

      # Database
      DATABASE_URL: postgresql://uitest:uitest@postgres:5432/uitest
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Security
      SECRET_KEY: dev-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # Storage
      ARTIFACT_STORAGE_TYPE: local
      ARTIFACT_STORAGE_PATH: /app/artifacts

      # Playwright
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright

      # LLM / MCP
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # MCP Configuration
      UITESTFLOW_MCP_ENABLED: ${UITESTFLOW_MCP_ENABLED:-false}
      UITESTFLOW_MCP_CLAUDE_ENABLED: ${UITESTFLOW_MCP_CLAUDE_ENABLED:-true}
      UITESTFLOW_MCP_GENERATION_ENABLED: ${UITESTFLOW_MCP_GENERATION_ENABLED:-true}
      UITESTFLOW_MCP_GUIDED_EXECUTION_ENABLED: ${UITESTFLOW_MCP_GUIDED_EXECUTION_ENABLED:-true}
      UITESTFLOW_MCP_CLAUDE_MODEL: ${UITESTFLOW_MCP_CLAUDE_MODEL:-claude-3-5-haiku-20241022}
      UITESTFLOW_MCP_CLAUDE_TEMPERATURE: ${UITESTFLOW_MCP_CLAUDE_TEMPERATURE:-0.3}
      UITESTFLOW_MCP_GUIDANCE_DETAIL_LEVEL: ${UITESTFLOW_MCP_GUIDANCE_DETAIL_LEVEL:-standard}
      UITESTFLOW_MCP_SELECTOR_ADAPTATION_ENABLED: ${UITESTFLOW_MCP_SELECTOR_ADAPTATION_ENABLED:-true}
      UITESTFLOW_MCP_ERROR_RECOVERY_ENABLED: ${UITESTFLOW_MCP_ERROR_RECOVERY_ENABLED:-true}
    ports:
      - "8018:8018"
    volumes:
      - .:/app
      - artifacts_data:/app/artifacts
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uitestflow
    command: uvicorn uitestflow.server.api:app --host 0.0.0.0 --port 8018 --reload

  # Celery Worker for Test Execution
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: uitestflow-celery-worker
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug

      # Database
      DATABASE_URL: postgresql://uitest:uitest@postgres:5432/uitest

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Storage
      ARTIFACT_STORAGE_TYPE: local
      ARTIFACT_STORAGE_PATH: /app/artifacts

      # Playwright
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright

      # LLM / MCP
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # MCP Configuration
      UITESTFLOW_MCP_ENABLED: ${UITESTFLOW_MCP_ENABLED:-false}
      UITESTFLOW_MCP_CLAUDE_ENABLED: ${UITESTFLOW_MCP_CLAUDE_ENABLED:-true}
      UITESTFLOW_MCP_GENERATION_ENABLED: ${UITESTFLOW_MCP_GENERATION_ENABLED:-true}
      UITESTFLOW_MCP_GUIDED_EXECUTION_ENABLED: ${UITESTFLOW_MCP_GUIDED_EXECUTION_ENABLED:-true}
      UITESTFLOW_MCP_CLAUDE_MODEL: ${UITESTFLOW_MCP_CLAUDE_MODEL:-claude-3-5-haiku-20241022}
    volumes:
      - .:/app
      - artifacts_data:/app/artifacts
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uitestflow
    command: celery -A uitestflow.worker.tasks worker --loglevel=info --concurrency=4

  # Celery Beat for Scheduled Tasks
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: uitestflow-celery-beat
    environment:
      # Application
      ENVIRONMENT: development

      # Database
      DATABASE_URL: postgresql://uitest:uitest@postgres:5432/uitest

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uitestflow
    command: celery -A uitestflow.worker.tasks beat --loglevel=info

  # Flower - Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: uitestflow-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    depends_on:
      - redis
      - celery-worker
    networks:
      - uitestflow
    command: celery -A uitestflow.worker.tasks flower --port=5555

  # MinIO - S3-compatible object storage (optional, for local development)
  minio:
    image: minio/minio:latest
    container_name: uitestflow-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - uitestflow
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # React UI Development Server (optional, for UI development)
  ui:
    image: node:20-alpine
    container_name: uitestflow-ui
    working_dir: /app/ui
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8018
    ports:
      - "3000:3000"
    volumes:
      - ./uitestflow/ui:/app/ui
      - ui_node_modules:/app/ui/node_modules
    networks:
      - uitestflow
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - ui-dev
    depends_on:
      - app

  # Nginx - Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: uitestflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - uitestflow
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  artifacts_data:
    driver: local
  logs_data:
    driver: local
  minio_data:
    driver: local
  ui_node_modules:
    driver: local

networks:
  uitestflow:
    driver: bridge
    name: uitestflow-network
