# Ruff configuration for UITestFlow
# Documentation: https://docs.astral.sh/ruff/

# Target Python 3.11+
target-version = "py311"

# Line length to match Black
line-length = 100

# Enable preview features
preview = true

# Exclude patterns
extend-exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

[lint]
# Enable rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C",     # flake8-comprehensions
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "INT",   # flake8-gettext
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "FIX",   # flake8-fixme
    "ERA",   # eradicate
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "NPY",   # numpy-specific rules
    "PERF",  # perflint
    "FURB",  # refurb
    "LOG",   # flake8-logging
    "RUF",   # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals (conflicts with formatter)
    "TRY003",  # Avoid specifying long messages outside the exception class
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert (allowed in tests)
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "FIX002",  # Line contains TODO
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# __init__.py files can have unused imports
"__init__.py" = [
    "F401",    # Unused imports
    "F403",    # Star imports
]

# Migration files have special requirements
"migrations/**/*.py" = [
    "D",       # Missing docstrings
    "INP001",  # Implicit namespace package
]

# Scripts can use print statements
"scripts/**/*.py" = [
    "T20",     # Print statements
]

# Examples can use print, broad exceptions, late imports, etc.
"examples/**/*.py" = [
    "T20",     # Print statements
    "BLE001",  # Broad exceptions
    "PLC0415", # Import not at top level
    "PLR6201", # Use a set literal
    "ANN",     # Missing type annotations
    "D",       # Missing docstrings
    "S101",    # Use of assert
    "INP001",  # Implicit namespace package
    "B007",    # Loop control variable not used
]

# Test files also need these
"tests/**/*.py" = [
    "S101",    # Use of assert
    "ARG",     # Unused arguments
    "PLR2004", # Magic values
    "PLR0913", # Too many arguments
    "ANN",     # Missing type annotations
    "D",       # Missing docstrings
    "PLC0415", # Import not at top level
    "PLR6301", # Method could be function/static
    "PLR1714", # Merge comparisons
    "EM101",   # String literal in exception
    "INP001",  # Implicit namespace package
]

[lint.isort]
known-first-party = ["uitestflow"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[lint.flake8-bugbear]
# Allow default mutable arguments (Pydantic uses them)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "typer.Option", "typer.Argument"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.mccabe]
# Maximum complexity
max-complexity = 10

[lint.pylint]
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 50

[lint.pydocstyle]
# Use Google docstring convention
convention = "google"

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Detect line endings automatically
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings
docstring-code-format = true

# Set the line length limit for code examples in docstrings
docstring-code-line-length = "dynamic"
