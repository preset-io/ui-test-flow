# Example Test with MCP Metadata
# This test demonstrates a complete test definition with MCP annotations
# Generated by Claude via Model Context Protocol (MCP)

version: "1.0"
name: "Login and Dashboard Navigation"
description: |
  Complete test flow for user authentication and dashboard access.
  Tests login functionality, session persistence, and dashboard loading.

# Base URL - can be overridden by profile or CLI
url: "http://example.com"

# Tags for categorization and filtering
tags:
  - authentication
  - dashboard
  - smoke-test
  - mcp-generated

# Browser configuration
browser_config:
  type: chromium
  headless: true
  viewport:
    width: 1920
    height: 1080
  timeout: 30000

# Authentication configuration
auth_config:
  type: form
  username: "admin"
  password: "password123"

# Screenshot strategy
screenshot_strategy: "key_points"

# Test steps
steps:
  # Step 1: Navigate to login page
  - name: "Navigate to login page"
    action: "goto"
    url: "{{ base_url }}/login"
    description: "Load the login page and wait for it to be ready"
    screenshot: true
    wait_after: 1000

  # Step 2: Verify login form is visible
  - name: "Wait for login form"
    action: "wait_for"
    selector: "form#login-form"
    timeout: 5000
    description: "Ensure login form is present before filling"

  # Step 3: Fill username field
  - name: "Enter username"
    action: "fill"
    selector: 'input[name="username"]'
    value: "{{ auth.username }}"
    description: "Fill the username field with credentials"
    retry:
      max_attempts: 3
      delay_ms: 1000
      exponential_backoff: true

  # Step 4: Fill password field
  - name: "Enter password"
    action: "fill"
    selector: 'input[name="password"]'
    value: "{{ auth.password }}"
    description: "Fill the password field"

  # Step 5: Click login button
  - name: "Click login button"
    action: "click"
    selector: 'button[type="submit"]'
    description: "Submit the login form"
    screenshot: true
    wait_after: 2000

  # Step 6: Wait for navigation to dashboard
  - name: "Wait for dashboard to load"
    action: "wait_for"
    selector: ".dashboard-container"
    timeout: 10000
    description: "Ensure dashboard page loads after successful login"
    screenshot: true

  # Step 7: Verify user menu is present
  - name: "Verify user menu"
    action: "expect"
    selector: ".user-menu"
    value:
      visible: true
    description: "Confirm user is logged in by checking for user menu"

  # Step 8: Check dashboard title
  - name: "Verify dashboard title"
    action: "expect"
    selector: "h1.dashboard-title"
    value:
      has_text: "Dashboard"
    description: "Validate dashboard page title"

# Evaluators for test validation
evaluators:
  # Execution evaluator - all steps must complete
  - name: "all_steps_completed"
    type: "all_steps_completed"
    required: true
    weight: 1.0
    params: {}

  # No exceptions during test execution
  - name: "no_exceptions"
    type: "no_exceptions"
    required: true
    weight: 1.0
    params: {}

  # URL validation - should be on dashboard
  - name: "final_url_check"
    type: "url_matches"
    required: true
    weight: 0.8
    params:
      pattern: ".*/dashboard.*"
      match_type: "regex"

  # Console error check
  - name: "no_console_errors"
    type: "no_console_errors"
    required: false
    weight: 0.5
    params:
      max_errors: 0

  # Performance check
  - name: "page_load_time"
    type: "page_load_time"
    required: false
    weight: 0.3
    params:
      max_load_time_ms: 5000

# MCP Metadata - tracks how this test was generated
mcp_metadata:
  generated_by: "claude"
  generation_model: "claude-3-5-haiku-20241022"
  generation_timestamp: "2024-01-15T10:30:00Z"
  generation_prompt: |
    Create a test for login functionality with the following requirements:
    - Navigate to login page
    - Fill in username and password
    - Submit the form
    - Verify dashboard loads
    - Check for user menu presence
  generation_temperature: 0.3
  tokens_used: 1247
  generation_config:
    max_tokens: 4096
    timeout: 60
    detail_level: "standard"

# LLM configuration for guided execution
llm_config:
  enabled: true
  provider: "anthropic"
  model: "claude-3-5-haiku-20241022"
  temperature: 0.3
  max_tokens: 4096

# Retry configuration for flaky steps
retry_config:
  max_attempts: 3
  delay_ms: 1000
  exponential_backoff: true

# Execution timeout
timeout: 30000
