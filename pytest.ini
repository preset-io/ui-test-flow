# Pytest configuration for UITestFlow
# Documentation: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref

[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.4

# Command line options
addopts =
    # Verbose output
    -ra
    # Show summary of all test outcomes
    --strict-markers
    # Enforce strict config
    --strict-config
    # Coverage
    --cov=uitestflow
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=80
    # Show local variables in tracebacks
    --showlocals
    # Show warnings
    --tb=short
    # Enable all warnings
    -W default
    # Asyncio mode
    --asyncio-mode=auto
    # Parallel execution (install pytest-xdist for this)
    # -n auto

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full application flow)
    slow: Tests that take a long time to run
    asyncio: Async tests
    playwright: Tests using Playwright
    requires_browser: Tests requiring browser automation
    requires_db: Tests requiring database
    requires_redis: Tests requiring Redis
    requires_llm: Tests requiring LLM API access
    flaky: Tests that may fail intermittently
    smoke: Smoke tests for quick validation

# Asyncio configuration
asyncio_mode = auto

# Console output style
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    # Ignore specific warnings from third-party libraries
    ignore::DeprecationWarning:playwright.*
    ignore::DeprecationWarning:celery.*
    ignore::PendingDeprecationWarning

# Coverage configuration
[coverage:run]
source = uitestflow
branch = True
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */venv/*
    */migrations/*
    */scripts/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    def __str__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about type checking blocks
    if TYPE_CHECKING:
    # Protocol methods
    @typing.overload
    # Ellipsis
    \.\.\.

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
